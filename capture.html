<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Capture</title>
<meta name="apple-mobile-web-app-title" content="Capture">
<link rel="apple-touch-icon" href="/todos-icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/todos-icon-512.png">
<link rel="icon" type="image/png" sizes="180x180" href="/todos-icon-180.png">
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8e8e93; --faint:#aeaeb2;
    --divider:rgba(60,60,67,.13); --field:#e9e9ee; --shadow:0 1px 2px rgba(0,0,0,.04);
    --accent:#007aff; --pin:#ff9f0a; --warn:#ff3b30;
    --tabbar:rgba(248,248,250,.94);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#8d8d93; --faint:#5a5a5e;
      --divider:rgba(84,84,88,.5); --field:#2c2c2e; --shadow:none;
      --tabbar:rgba(22,22,24,.94); }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .screen{ max-width:640px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 88px); }
  h1{ font-size:32px; font-weight:800; letter-spacing:-.6px; margin:6px 2px 4px; }
  .daynote{ font-size:14px; color:var(--sub); margin:0 2px 18px; }
  .hide{ display:none !important; }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--tabbar); backdrop-filter:blur(18px);
    border-top:1px solid var(--divider); padding-bottom:env(safe-area-inset-bottom); display:flex;
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer; padding:8px 0 7px; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--sub); font-size:10.5px; font-weight:600;
  }
  .tab svg{ width:24px; height:24px; }
  .tab.on{ color:var(--accent); }
  .badge{
    position:absolute; top:4px; left:50%; margin-left:6px; background:var(--warn); color:#fff;
    font-size:10px; font-weight:700; border-radius:9px; padding:1px 5px; min-width:17px; text-align:center;
  }

  .card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .grouphead{ display:flex; align-items:baseline; gap:8px; padding:22px 4px 8px; }
  .grouphead h2{ font-size:19px; font-weight:700; margin:0; letter-spacing:-.3px; }
  .grouphead .n{ margin-left:auto; color:var(--faint); font-size:15px; font-weight:600; }

  .review{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:15px 16px 13px; margin-bottom:16px; }
  .review .rt{ font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--sub); margin-bottom:9px; }
  .review ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
  .review li{ font-size:15.5px; display:flex; align-items:baseline; gap:9px; }
  .review li b{ font-weight:700; min-width:20px; text-align:right; }
  .review .rbtn{
    margin-top:12px; width:100%; border:0; background:var(--field); color:var(--accent);
    font:inherit; font-size:15px; font-weight:650; padding:10px; border-radius:10px; cursor:pointer;
  }
  .review.quiet .rt{ margin-bottom:6px; }
  .review .quiettext{ font-size:15px; color:var(--sub); line-height:1.4; }

  .row{ display:flex; align-items:flex-start; gap:11px; padding:12px 14px; position:relative; }
  .row + .row::before{ content:""; position:absolute; top:0; left:46px; right:0; height:1px; background:var(--divider); }
  .row.note + .row::before, .row + .row.note::before{ left:14px; }
  .check{
    flex:0 0 auto; width:23px; height:23px; border-radius:50%; border:1.6px solid #c7c7cc;
    margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .check.done{ border-color:transparent; background:var(--accent); }
  .check svg{ opacity:0; width:13px; height:13px; }
  .check.done svg{ opacity:1; }
  .notedot{ flex:0 0 auto; width:23px; display:flex; justify-content:center; padding-top:7px; }
  .notedot span{ width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .main{ flex:1 1 auto; min-width:0; cursor:pointer; }
  .ttl{ font-size:16.5px; line-height:1.3; word-wrap:break-word; }
  .ttl.strong{ font-weight:700; letter-spacing:-.2px; }
  .row.isdone .ttl{ color:var(--sub); text-decoration:line-through; }
  .why{ font-size:12.5px; color:var(--sub); margin-top:3px; line-height:1.35; }
  .metaline{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  .tag{ font-size:11px; font-weight:600; color:var(--sub); background:var(--field); border-radius:5px; padding:2px 6px; }
  .tag.due{ color:#fff; background:var(--warn); }
  .tag.soon{ color:#fff; background:var(--pin); }
  .tag.cat{ color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .pinbtn{ flex:0 0 auto; border:0; background:transparent; cursor:pointer; padding:4px 2px 4px 6px; align-self:flex-start; }
  .pinbtn svg{ width:19px; height:19px; }

  .bodytext{ font-size:14.5px; line-height:1.45; word-wrap:break-word; margin-top:5px; }
  .bodytext p{ margin:0 0 8px; white-space:pre-wrap; } .bodytext p:last-child{ margin:0; }
  .tw{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:5px 0 9px; }
  .bodytext table{ border-collapse:collapse; font-size:13.5px; min-width:100%; white-space:nowrap; }
  .bodytext th,.bodytext td{ text-align:right; padding:4px 7px; border-bottom:1px solid var(--divider); }
  .bodytext th:first-child,.bodytext td:first-child{ text-align:left; font-weight:600; }
  .bodytext thead th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); }
  .bodytext tbody tr:last-child td{ border-bottom:0; }
  .clamp{ max-height:120px; overflow:hidden; -webkit-mask-image:linear-gradient(#000 65%,transparent); mask-image:linear-gradient(#000 65%,transparent); }
  .morebtn{ background:none; border:0; color:var(--accent); font:inherit; font-size:13.5px; font-weight:650; padding:5px 0 0; cursor:pointer; }

  .composer{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:12px 13px 11px; }
  .composer textarea{
    width:100%; border:0; background:transparent; color:var(--text); font:inherit; font-size:17px;
    line-height:1.4; resize:none; outline:none; min-height:104px; max-height:46vh; overflow-y:auto;
  }
  .composer textarea::placeholder{ color:var(--faint); }
  .crow{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .chint{ font-size:12.5px; color:var(--faint); flex:1 1 auto; }
  .savebtn{
    flex:0 0 auto; border:0; background:var(--accent); color:#fff; font:inherit; font-size:16px;
    font-weight:650; padding:9px 22px; border-radius:10px; cursor:pointer;
  }
  .savebtn:disabled{ opacity:.3; }

  .searchwrap{ position:relative; margin:0 0 14px; }
  .searchwrap input{
    width:100%; border:0; border-radius:11px; background:var(--field);
    padding:11px 12px 11px 36px; font-size:17px; color:var(--text); outline:none;
  }
  .searchwrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.4; }
  .filters{ display:flex; gap:7px; overflow-x:auto; padding:0 0 14px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .filters::-webkit-scrollbar{ display:none; }
  .fchip{
    flex:0 0 auto; border:0; border-radius:15px; padding:6px 13px; font-size:13.5px; font-weight:600;
    background:var(--card); color:var(--text); box-shadow:var(--shadow); cursor:pointer; white-space:nowrap;
  }
  .fchip.on{ background:var(--accent); color:#fff; }

  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:80; opacity:0; pointer-events:none; transition:opacity .18s; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--bg);
    border-radius:16px 16px 0 0; transform:translateY(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
    max-height:92vh; display:flex; flex-direction:column;
  }
  .sheet.open{ transform:translateY(0); }
  .sheethead{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--divider); flex:0 0 auto; }
  .sheethead h3{ margin:0; font-size:17px; font-weight:700; flex:1 1 auto; text-align:center; }
  .sheethead button{ border:0; background:none; color:var(--accent); font:inherit; font-size:16px; cursor:pointer; padding:4px 2px; }
  .sheethead button.strong{ font-weight:700; }
  .sheetbody{ overflow-y:auto; padding:14px 16px calc(env(safe-area-inset-bottom) + 22px); -webkit-overflow-scrolling:touch; }
  .fld{ margin-bottom:15px; }
  .fld label{ display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); margin-bottom:6px; }
  .fld textarea,.fld input{
    width:100%; border:0; background:var(--card); border-radius:10px; padding:11px 12px;
    font:inherit; font-size:16.5px; color:var(--text); outline:none;
  }
  .fld textarea{ min-height:120px; resize:vertical; line-height:1.4; }
  .seg{ display:flex; background:var(--field); border-radius:9px; padding:2px; gap:2px; }
  .seg button{
    flex:1; border:0; background:transparent; font:inherit; font-size:14px; font-weight:600;
    color:var(--sub); padding:8px 2px; border-radius:7px; cursor:pointer;
  }
  .seg button.on{ background:var(--card); color:var(--text); box-shadow:var(--shadow); }
  .danger{ width:100%; border:0; background:transparent; color:var(--warn); font:inherit; font-size:16px; font-weight:600; padding:13px; cursor:pointer; }
  .origbox{ background:var(--field); border-radius:10px; padding:11px 12px; font-size:14px; line-height:1.45; white-space:pre-wrap; color:var(--sub); max-height:180px; overflow-y:auto; }

  .chg{ background:var(--card); border-radius:11px; padding:12px 13px; margin-bottom:9px; }
  .chg .cf{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--sub); }
  .chg .cv{ font-size:15px; margin-top:4px; line-height:1.35; }
  .chg .cr{ font-size:13px; color:var(--sub); margin-top:5px; line-height:1.4; }
  .chg .cbtns{ display:flex; gap:8px; margin-top:10px; }
  .chg .cbtns button{ flex:1; border:0; border-radius:8px; padding:8px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; }
  .keep{ background:var(--accent); color:#fff; } .undo{ background:var(--field); color:var(--text); }

  .allbtn{ width:100%; margin-top:14px; border:0; background:var(--card); box-shadow:var(--shadow);
    color:var(--accent); font:inherit; font-size:15.5px; font-weight:650; padding:13px; border-radius:12px; cursor:pointer; }
  .backbtn{ border:0; background:none; color:var(--accent); font:inherit; font-size:16px;
    font-weight:600; padding:2px 0 6px; margin-left:-2px; cursor:pointer; }
  .empty{ text-align:center; color:var(--sub); padding:54px 24px; font-size:15.5px; line-height:1.5; }
  .banner{ background:var(--warn); color:#fff; padding:9px 13px; border-radius:10px; font-size:13.5px; margin-bottom:12px; display:none; }
  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 76px); transform:translate(-50%,14px);
    background:#1c1c1e; color:#fff; border-radius:11px; padding:11px 14px; font-size:14.5px; z-index:95;
    display:flex; align-items:center; gap:14px; opacity:0; pointer-events:none; transition:.2s; box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  .toast.on{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  .toast button{ border:0; background:none; color:#4da3ff; font:inherit; font-weight:700; cursor:pointer; }
  .stale{ position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:50%; transform:translateX(-50%); z-index:70;
    background:var(--accent); color:#fff; border:0; border-radius:14px; padding:6px 13px; font:inherit; font-size:13px;
    font-weight:650; box-shadow:0 3px 12px rgba(0,0,0,.2); cursor:pointer; display:none; }
</style>
</head>
<body>

<div class="screen"><div id="banner" class="banner"></div><div id="view"></div></div>
<button class="stale" id="stale">New items &middot; tap to refresh</button>

<div class="tabbar">
  <button class="tab on" data-tab="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now<span class="badge hide" id="nowbadge"></span></button>
  <button class="tab" data-tab="dump"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Dump</button>
  <button class="tab" data-tab="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 015.5 4H10a2 2 0 012 2 2 2 0 012-2h4.5A1.5 1.5 0 0120 5.5v12a1.5 1.5 0 01-1.5 1.5H14a2 2 0 00-2 2 2 2 0 00-2-2H5.5A1.5 1.5 0 014 17.5z"/></svg>Memory</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheethead"><button id="sheetcancel">Cancel</button><h3 id="sheettitle">Edit</h3><button id="sheetsave" class="strong">Save</button></div><div class="sheetbody" id="sheetbody"></div></div>
<div class="toast" id="toast"><span id="toasttext"></span><button id="toastbtn">Undo</button></div>

<script>
const SB="https://vqqmyjapnvmpktxikrrz.supabase.co/rest/v1";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxcW15amFwbnZtcGt0eGlrcnJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5OTQzMzQsImV4cCI6MjA5OTU3MDMzNH0.6XS5-iJgnUiOx7RIEQtNxwuhLEvL9MsnzHpqjjewkL4";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const FIELDS="id,created_at,body,done,done_at,category,kind,title,summary,priority,pinned,remind_at,tags,surfaced_reason,surfaced_on,locked_fields";

let items=[], run=null, changes=[], tab="now", query="", filterCat=null, showAll=false;
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const $=id=>document.getElementById(id);

async function api(path,opt){ const r=await fetch(SB+path,{...opt,headers:{...H,...((opt&&opt.headers)||{})}});
  if(!r.ok) throw new Error(r.status+" "+await r.text()); return r; }

async function load(silent){
  try{
    const r=await api(`/reminders?select=${FIELDS}&deleted_at=is.null&order=created_at.desc`);
    const fresh=await r.json();
    // never yank the page out from under an open sheet or a half-typed capture
    if(silent && (sheetOpen() || composerDirty())){
      if(fresh.length!==items.length) $("stale").style.display="block";
      return;
    }
    items=fresh; $("banner").style.display="none"; $("stale").style.display="none";
    try{
      const rr=await api("/agent_runs?select=*&order=ran_at.desc&limit=1");
      run=(await rr.json())[0]||null;
      const latest = run ? await (await api(`/agent_changes?select=*&batch_id=eq.${run.batch_id}&reverted=eq.false&order=changed_at.desc`)).json() : [];
      // A new empty daily run must not hide an older question Ryan has not
      // answered yet. Keep the latest review history plus every still-pending
      // decision, no matter which morning created it.
      const pending = await (await api("/agent_changes?select=*&needs_ok=eq.true&confirmed=is.null&reverted=eq.false&order=changed_at.desc")).json();
      const seen=new Set();
      changes=[...pending,...latest].filter(c=>{
        if(seen.has(c.id)) return false;
        seen.add(c.id); return true;
      });
    }catch(e){
      $("banner").textContent="Items loaded, but the daily review status couldn't load.";
      $("banner").style.display="block"; }
    render();
  }catch(e){ $("banner").textContent=items.length?"Offline — showing what loaded last.":"Offline — couldn't load your captures."; $("banner").style.display="block"; }
}

async function patch(id,body){
  const i=items.findIndex(x=>x.id===id), before=i>=0?{...items[i]}:null;
  if(i>=0) Object.assign(items[i],body);
  render();
  try{ await api(`/reminders?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)}); return true; }
  catch(e){ if(i>=0&&before) items[i]=before; render(); toast("Couldn't save — try again.",null); return false; }
}

// capture asks for nothing: no type, no date, no category
async function capture(text){
  if(!text.trim()) return false;
  try{
    const r=await api("/reminders",{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({body:text.replace(/\s+$/,"")})});
    items.unshift((await r.json())[0]); render(); toast("Saved",null); return true;
  }catch(e){ toast("Couldn't save — your text is still here.",null); return false; }
}

const kindOf=it=> it.kind || (it.done ? "memory" : "uncertain");
const isMemory=it=> kindOf(it)==="memory" || (it.done && !it.remind_at);
function dueState(it){
  if(!it.remind_at) return null;
  const t=todayISO();
  return it.remind_at<t ? "over" : it.remind_at===t ? "today" : "future";
}

// Now stays short on purpose. Pinned always wins over anything the agent chose.
function attentionList(){
  const live=items.filter(x=>!x.done);
  const pin=live.filter(x=>x.pinned);
  const due=live.filter(x=>!x.pinned && ["over","today"].includes(dueState(x)))
                .sort((a,b)=>(a.remind_at||"").localeCompare(b.remind_at||""));
  const pick=live.filter(x=>!x.pinned && !due.includes(x) && x.surfaced_on===todayISO())
                 .sort((a,b)=>(b.priority||0)-(a.priority||0));
  return [...pin,...due,...pick];
}
function nowList(){
  const live=items.filter(x=>!x.done), out=attentionList();
  if(out.length<4){
    const unsure=live.filter(x=>!out.includes(x) && kindOf(x)==="uncertain" && !x.remind_at);
    out.push(...unsure.slice(0,4-out.length));
  }
  return out.slice(0,12);
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  const pend=changes.filter(c=>c.needs_ok && c.confirmed===null).length;
  const nb=$("nowbadge");
  if(pend){ nb.textContent=pend; nb.classList.remove("hide"); } else nb.classList.add("hide");
  $("view").innerHTML = tab==="now" ? (showAll?viewAll():viewNow()) : tab==="dump" ? viewDump() : viewMemory();
  wire();
  const c=$("composer"); if(c) grow(c);
}

function viewNow(){
  const list=nowList(), d=new Date();
  return `<h1>Now</h1>
  <p class="daynote">${d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p>
  ${reviewCard()}
  ${list.length? `<div class="card">${list.map(it=>rowHtml(it,false)).join("")}</div>`
   : `<div class="empty">Nothing needs you right now.<br>Anything you dump will come back when it matters.</div>`}
  ${openCount()? `<button class="allbtn" id="showall">See all ${openCount()} open &rsaquo;</button>`:""}`;
}

const openCount=()=>items.filter(x=>!x.done && !isMemory(x)).length;

// Everything still open, grouped by category. Deliberately behind Now rather
// than beside it — Now stays the short list, this is the whole pile when you
// want it.
function viewAll(){
  const live=items.filter(x=>!x.done && !isMemory(x));
  const groups={};
  live.forEach(it=>{ const k=it.category||"Uncategorised"; (groups[k]=groups[k]||[]).push(it); });
  const keys=Object.keys(groups).sort((a,b)=>
    a==="Uncategorised" ? 1 : b==="Uncategorised" ? -1 : groups[b].length-groups[a].length);
  const rank=it=>(it.pinned?0:1);
  return `<button class="backbtn" id="backnow">&lsaquo; Now</button>
  <h1>Everything open</h1>
  <p class="daynote">${live.length} ${live.length===1?"item":"items"} across ${keys.length} ${keys.length===1?"list":"lists"}</p>
  ${keys.map(k=>{
    const rows=groups[k].slice().sort((a,b)=>rank(a)-rank(b)||(b.priority||0)-(a.priority||0));
    return `<div class="grouphead"><h2>${escapeHtml(k)}</h2><span class="n">${rows.length}</span></div>
      <div class="card">${rows.map(it=>rowHtml(it,false)).join("")}</div>`;
  }).join("")}`;
}

function reviewCard(){
  if(!run) return `<div class="review quiet"><div class="rt">Daily review</div>
    <div class="quiettext">The agent hasn't run yet. Everything you capture waits in Dump until it does.</div></div>`;
  const pend=changes.filter(c=>c.needs_ok && c.confirmed===null).length;
  const attention=attentionList().length;
  const when=new Date(run.ran_at).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return `<div class="review"><div class="rt">Daily review &middot; ${when}</div>
    <ul>
      <li><b>${attention}</b> ${attention===1?"item needs":"items need"} attention</li>
      <li><b>${run.organised_ct}</b> new ${run.organised_ct===1?"entry was":"entries were"} organized</li>
      ${pend?`<li><b>${pend}</b> ${pend===1?"decision needs":"decisions need"} you</li>`:""}
    </ul>
    ${changes.length?`<button class="rbtn" id="openreview">Review what changed</button>`:""}</div>`;
}

function viewDump(){
  const recent=items.slice(0,25);
  return `<h1>Dump</h1>
  <p class="daynote">Put it here now. It comes back when it matters.</p>
  <div class="composer">
    <textarea id="composer" placeholder="Anything at all &mdash; a job, a thought, something a customer said, a number worth keeping&hellip;"></textarea>
    <div class="crow"><span class="chint">Return makes a new line</span><button class="savebtn" id="savebtn" disabled>Save</button></div>
  </div>
  <div class="grouphead"><h2>Recent captures</h2><span class="n">${recent.length}</span></div>
  ${recent.length?`<div class="card">${recent.map(it=>rowHtml(it,true)).join("")}</div>`:`<div class="empty">Nothing captured yet.</div>`}`;
}

function viewMemory(){
  const q=query.trim().toLowerCase();
  let list = q
    ? items.filter(x=>((x.body||"")+" "+(x.title||"")+" "+(x.summary||"")+" "+((x.tags||[]).join(" "))).toLowerCase().includes(q))
    : items.filter(isMemory);
  if(filterCat) list=list.filter(x=>x.category===filterCat);
  const cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();
  const upcoming=items.filter(x=>!x.done && dueState(x)==="future")
    .sort((a,b)=>a.remind_at.localeCompare(b.remind_at)).slice(0,6);
  const groups={};
  list.forEach(it=>{ const k=(it.done_at||it.created_at).slice(0,7); (groups[k]=groups[k]||[]).push(it); });
  const keys=Object.keys(groups).sort().reverse();
  const monthName=k=>{ const [y,m]=k.split("-");
    return new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); };
  return `<h1>Memory</h1>
  <div class="searchwrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="search" placeholder="Search everything" value="${escapeAttr(query)}" autocomplete="off"></div>
  ${cats.length?`<div class="filters">${cats.map(c=>`<button class="fchip ${filterCat===c?"on":""}" data-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join("")}</div>`:""}
  ${(upcoming.length&&!q)?`<div class="grouphead"><h2>Upcoming</h2><span class="n">${upcoming.length}</span></div>
     <div class="card">${upcoming.map(it=>rowHtml(it,false)).join("")}</div>`:""}
  ${keys.length?keys.map(k=>`<div class="grouphead"><h2>${monthName(k)}</h2><span class="n">${groups[k].length}</span></div>
     <div class="card">${groups[k].map(it=>rowHtml(it,false)).join("")}</div>`).join("")
   :`<div class="empty">${q?"Nothing matches that.":"Nothing filed here yet.<br>The agent moves reference material in as it reviews."}</div>`}`;
}

function rowHtml(it,inDump){
  const memoryish=isMemory(it);
  const heading=it.title || firstLine(it.body);
  const rest = it.title ? it.body : it.body.slice(firstLine(it.body).length).replace(/^\n+/,"");
  const showBody = memoryish && rest.trim();
  const ds=dueState(it), bits=[];
  if(ds==="over") bits.push(`<span class="tag due">Overdue ${fmtDate(it.remind_at)}</span>`);
  else if(ds==="today") bits.push(`<span class="tag due">Today</span>`);
  else if(ds==="future") bits.push(`<span class="tag soon">${fmtDate(it.remind_at)}</span>`);
  if(inDump){ if(it.category) bits.push(`<span class="tag cat">${escapeHtml(it.category)}</span>`);
              else if(!it.kind) bits.push(`<span class="tag">not filed yet</span>`); }
  (it.tags||[]).slice(0,3).forEach(t=>bits.push(`<span class="tag">${escapeHtml(t)}</span>`));
  return `<div class="row ${memoryish?"note":""} ${it.done?"isdone":""}">
    ${memoryish?`<div class="notedot"><span></span></div>`
      :`<div class="check ${it.done?"done":""}" data-check="${it.id}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19 7.5"/></svg></div>`}
    <div class="main" data-edit="${it.id}">
      <div class="ttl ${memoryish?"strong":""}">${escapeHtml(heading)}</div>
      ${(it.surfaced_reason&&tab==="now")?`<div class="why">${escapeHtml(it.surfaced_reason)}</div>`:""}
      ${showBody?`<div class="bodytext ${rest.length>240?"clamp":""}" data-body="${it.id}">${richText(rest)}</div>
        ${rest.length>240?`<button class="morebtn" data-more="${it.id}">More</button>`:""}`:""}
      ${bits.length?`<div class="metaline">${bits.join("")}</div>`:""}
    </div>
    <button class="pinbtn" data-pin="${it.id}" title="${it.pinned?"Unpin":"Pin to Now"}">
      <svg viewBox="0 0 24 24" fill="${it.pinned?"var(--pin)":"none"}" stroke="${it.pinned?"var(--pin)":"#c7c7cc"}" stroke-width="1.7" stroke-linejoin="round"><path d="M9 4h6l-1 6 3.5 3v1.5h-11V13L10 10z"/><path d="M12 14.5V20"/></svg></button>
  </div>`;
}

// keep line breaks, and turn space-aligned columns into a real table
function richText(t){
  const lines=t.split("\n"); let out="",para=[],tbl=[];
  const fp=()=>{ if(para.length){ out+=`<p>${escapeHtml(para.join("\n"))}</p>`; para=[]; } };
  const ft=()=>{ if(!tbl.length) return;
    const rows=tbl.map(l=>l.trim().split(/\s{2,}/)), head=rows.shift();
    out+=`<div class="tw"><table><thead><tr>${head.map(c=>`<th>${escapeHtml(c)}</th>`).join("")}</tr></thead><tbody>`
      +rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("")+`</tbody></table></div>`; tbl=[]; };
  for(const ln of lines){
    if(ln.trim() && ln.trim().split(/\s{2,}/).length>=3){ fp(); tbl.push(ln); }
    else if(!ln.trim()){ ft(); fp(); } else { ft(); para.push(ln); }
  }
  ft(); fp(); return out;
}

function openEdit(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  $("sheettitle").textContent="Edit";
  $("sheetsave").style.visibility="visible";
  $("sheetbody").innerHTML=`
    <div class="fld"><label>What you wrote</label><textarea id="e_body">${escapeHtml(it.body||"")}</textarea></div>
    <div class="fld"><label>Type</label><div class="seg" id="e_kind">
      ${[["actionable","To do"],["future","Later"],["memory","Memory"],["uncertain","Unsure"]].map(([k,l])=>
        `<button data-k="${k}" class="${kindOf(it)===k?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="fld"><label>Bring it back on</label><input type="date" id="e_date" value="${it.remind_at||""}"></div>
    <div class="fld"><label>Priority</label><div class="seg" id="e_pri">
      ${[["0","None"],["40","Normal"],["70","High"],["95","Urgent"]].map(([v,l])=>
        `<button data-p="${v}" class="${priBand(it.priority)===v?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="fld"><label>Category</label><input id="e_cat" value="${escapeAttr(it.category||"")}" placeholder="none" autocomplete="off"></div>
    ${it.summary?`<div class="fld"><label>Agent summary</label><div class="origbox">${escapeHtml(it.summary)}</div></div>`:""}
    <button class="danger" id="e_del">Delete</button>`;
  [["e_kind"],["e_pri"]].forEach(([id2])=>{
    const el=$(id2); el.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      el.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }); });
  $("e_del").onclick=()=>{ closeSheet(); softDelete(id); };
  $("sheetsave").onclick=async()=>{
    const kind=$("e_kind").querySelector(".on").dataset.k;
    const pri=+$("e_pri").querySelector(".on").dataset.p;
    const body=$("e_body").value, date=$("e_date").value||null, cat=$("e_cat").value.trim()||null;
    const lock=new Set(it.locked_fields||[]);
    if(kind!==kindOf(it)) lock.add("kind");
    if(pri!==(it.priority||0)) lock.add("priority");
    if(date!==(it.remind_at||null)) lock.add("remind_at");
    if(cat!==(it.category||null)) lock.add("category");
    if(body!==it.body) lock.add("body");
    closeSheet();
    await patch(id,{body,kind,priority:pri,remind_at:date,category:cat,locked_fields:[...lock]});
  };
  showSheet();
}

function openReview(){
  $("sheettitle").textContent="What the agent changed";
  $("sheetsave").style.visibility="hidden";
  const label={kind:"Filed as",category:"Category",tags:"Tags",priority:"Priority",
    summary:"Summary",title:"Title",related:"Linked to",remind_at:"Bring back on",surfaced_on:"Surfaced"};
  const val=(field,v)=>{
    if(v==null || v==="") return "nothing";
    if(field==="kind") return ({actionable:"To do",future:"Later",memory:"Memory",uncertain:"Unsure"})[v]||v;
    if(field==="priority") return +v>=90?"Urgent":+v>=60?"High":+v>0?"Normal":"None";
    if(field==="related"){
      const ids=Array.isArray(v)?v:[v];
      return ids.map(id=>{ const linked=items.find(x=>x.id===id); return linked?firstLine(linked.title||linked.body):"Related entry"; }).join(", ");
    }
    return typeof v==="object"?JSON.stringify(v).replace(/[\[\]"]/g,""):String(v);
  };
  $("sheetbody").innerHTML = changes.length ? changes.map(c=>{
    const it=items.find(x=>x.id===c.entry_id);
    return `<div class="chg">
      <div class="cf">${label[c.field]||c.field}</div>
      <div class="cv">${escapeHtml(it?firstLine(it.title||it.body):"(entry)")}</div>
      <div class="cr">${escapeHtml(val(c.field,c.old_value))} &rarr; <b>${escapeHtml(val(c.field,c.new_value))}</b></div>
      ${c.reason?`<div class="cr">${escapeHtml(c.reason)}</div>`:""}
      ${c.confirmed===null?`<div class="cbtns"><button class="keep" data-ok="${c.id}">Keep</button>
        <button class="undo" data-revert="${c.id}">Undo</button></div>`:""}
    </div>`; }).join("") : `<div class="empty">No changes to review.</div>`;
  $("sheetbody").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>decide(b.dataset.ok,true));
  $("sheetbody").querySelectorAll("[data-revert]").forEach(b=>b.onclick=()=>decide(b.dataset.revert,false));
  showSheet();
}

async function decide(cid,keep){
  const c=changes.find(x=>x.id===cid); if(!c) return;
  if(!keep && !await patch(c.entry_id,{[c.field]:c.old_value})) return;
  try{ await api(`/agent_changes?id=eq.${cid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({confirmed:keep,reverted:!keep})}); }
  catch(e){
    if(!keep) await patch(c.entry_id,{[c.field]:c.new_value});
    toast("Couldn't save that decision — try again.",null); return;
  }
  changes=changes.filter(x=>x.id!==cid); openReview(); render();
}

// delete is soft and always undoable
async function softDelete(id){
  const index=items.findIndex(x=>x.id===id); if(index<0) return;
  const removed=items[index];
  items=items.filter(x=>x.id!==id); render();
  try{ await api(`/reminders?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({deleted_at:new Date().toISOString()})}); }
  catch(e){ items.splice(index,0,removed); render(); toast("Couldn't delete — try again.",null); return; }
  toast("Deleted",async()=>{
    try{ await api(`/reminders?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({deleted_at:null})}); await load(); }
    catch(e){ toast("Couldn't restore — try again.",null); }
  });
}

let toastTimer=null;
function toast(msg,undoFn){
  $("toasttext").textContent=msg;
  $("toastbtn").style.display=undoFn?"block":"none";
  $("toastbtn").onclick=async()=>{ $("toast").classList.remove("on"); if(undoFn) await undoFn(); };
  $("toast").classList.add("on"); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").classList.remove("on"), undoFn?6000:1800);
}

const sheetOpen=()=>$("sheet").classList.contains("open");
const composerDirty=()=>{ const c=$("composer"); return !!(c && c.value.trim()); };
function showSheet(){ $("sheet").classList.add("open"); $("scrim").classList.add("open"); }
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open");
  $("sheetsave").style.visibility="visible"; }
$("scrim").onclick=closeSheet; $("sheetcancel").onclick=closeSheet;

function wire(){
  const v=$("view");
  v.querySelectorAll("[data-check]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const it=items.find(x=>x.id===el.dataset.check);
    patch(el.dataset.check,{done:!it.done,done_at:it.done?null:new Date().toISOString()}); });
  v.querySelectorAll("[data-pin]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const it=items.find(x=>x.id===el.dataset.pin);
    const lock=new Set(it.locked_fields||[]); lock.add("pinned");
    patch(el.dataset.pin,{pinned:!it.pinned,locked_fields:[...lock]}); });
  v.querySelectorAll("[data-more]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const b=v.querySelector(`[data-body="${el.dataset.more}"]`);
    el.textContent=b.classList.toggle("clamp")?"More":"Less"; });
  v.querySelectorAll("[data-edit]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-more]")) return; openEdit(el.dataset.edit); });
  const rv=$("openreview"); if(rv) rv.onclick=openReview;
  const sa=$("showall"); if(sa) sa.onclick=()=>{ showAll=true; window.scrollTo(0,0); render(); };
  const bn=$("backnow"); if(bn) bn.onclick=()=>{ showAll=false; window.scrollTo(0,0); render(); };
  const s=$("search");
  if(s) s.oninput=()=>{ const p=s.selectionStart; query=s.value; render();
    const n=$("search"); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  v.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{
    filterCat = filterCat===el.dataset.cat ? null : el.dataset.cat; render(); });
  const c=$("composer"), sb=$("savebtn");
  if(c){ c.oninput=()=>{ grow(c); sb.disabled=!c.value.trim(); };
    sb.onclick=async()=>{ const t=c.value; sb.disabled=true;
      if(await capture(t)){ c.value=""; grow(c); } else sb.disabled=!c.value.trim(); }; }
}
function grow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,window.innerHeight*0.46)+"px"; }

function firstLine(s){ const i=(s||"").indexOf("\n"); return i<0?(s||""):s.slice(0,i); }
function priBand(p){ p=p||0; return p>=95?"95":p>=70?"70":p>=40?"40":"0"; }
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=d.split("-");
  return new Date(+y,+m-1,+dd).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/\n/g," "); }

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  tab=t.dataset.tab; query=""; filterCat=null; showAll=false; window.scrollTo(0,0); render(); });
$("stale").onclick=()=>{ $("stale").style.display="none"; load(); };

load();
setInterval(()=>load(true),60000);
</script>
