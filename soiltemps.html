.depths thead { border-bottom:1px solid var(--line); }

.depths th { text-align:left; font-weight:400; font-size:16px; color:var(--black); padding:0 16px 10px 0; }

.chart-empty { font-size:15px; color:var(--gray-2); }
.loading,.no-data { padding:26px 0 80px; color:var(--gray-2); border-top:1px solid var(--line); }

.ph,.ct { max-width:1240px; overflow:visible; }
.season { overflow:visible; }
.season-charts { display:flex; flex-direction:column; gap:32px; }
.season-plot { position:relative; overflow:visible; }
.season-plot .chart-label { margin-bottom:6px; }
.season-plot .legend { margin-top:0; margin-bottom:10px; }
.season-frame { position:relative; overflow:visible; }
.season-y { position:absolute; left:0; width:0; list-style:none; pointer-events:none; }
.season-y li { position:absolute; right:8px; transform:translateY(-50%); text-align:right; font-size:12px; line-height:1; color:var(--gray-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.season-x { position:absolute; left:0; right:0; bottom:0; height:34px; list-style:none; pointer-events:none; }
.season-x li { position:absolute; top:24px; font-size:12px; line-height:1; color:var(--gray-2); white-space:nowrap; }
.season-plot svg { display:block; width:100%; overflow:visible; }
.season-plot[data-kind="water"] svg { height:300px; }
.season-plot[data-kind="temp"] svg { height:260px; }
.season-tip { position:absolute; pointer-events:none; display:none; background:#fff; border:1px solid var(--line); padding:8px 10px; font-size:13px; color:var(--gray-1); font-variant-numeric:tabular-nums; white-space:nowrap; z-index:2; }
@media(max-width:960px) {
  .site-body { grid-template-columns:1fr; gap:36px; }

}
@media(max-width:760px) {

  .site-meta { font-size:15px; }

  .season-plot[data-kind="water"] svg { height:240px; }
  .season-plot[data-kind="temp"] svg { height:220px; }
  .soil-summary { grid-template-columns:1fr; gap:26px; }
  .site-body { grid-template-columns:1fr; gap:32px; }
  .depths { max-width:none; }
  .summary-value { font-size:68px; }
  .stat-v { font-size:28px; }
  .stat + .stat { padding-left:14px; }
  .site { margin-top:48px; }
  .site-head h2 { font-size:28px; }
}

<script>
const TZ = 'America/Chicago';
const DEPTH_COLORS = { 2: '#4FA3E0', 6: '#3590C9', 10: '#1F6FB2', 14: '#1A62A0', 18: '#165890', 22: '#124E80', 26: '#0E4574', 30: '#0B3C6E', 33: '#082A4E' };
const colorForDepth = d => DEPTH_COLORS[d] || '#1F6FB2';
const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtDayKey = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const deg = v => isNum(v) ? Math.round(v) + '&deg;' : '&ndash;';
const pct = v => isNum(v) ? v.toFixed(1) + '%' : '&ndash;';
const ct = iso => fmtTime.format(new Date(iso)) + ' CT';
function dayAtDepth(season, depth) {
  const i = ((season && season.depths_in) || []).indexOf(depth);
  if (i < 0) return null;
  const today = fmtDayKey.format(new Date());
  const days = (season.days || []).filter(d => d.date < today);
  const pool = days.length ? days : (season.days || []);
  for (let n = pool.length - 1; n >= 0; n--) {
    const d = pool[n];
    const avg = (d.t_avg || [])[i], high = (d.t_high || [])[i], low = (d.t_low || [])[i];
    if (isNum(avg) || isNum(high) || isNum(low)) return { date: d.date, avg_f: avg, high_f: high, low_f: low };
  }
  return null;
}

function summary(site) {
  const day = dayAtDepth(site.season, 2);
  if (day && (isNum(day.avg_f) || isNum(day.high_f) || isNum(day.low_f))) {
    return `
      <section class="soil-summary" aria-label="Daily soil temperature at 2 inches">
        <div>
          <p class="summary-label">Current</p>
          <p class="summary-value">${deg(day.avg_f)}</p>
        </div>
        <div class="summary-stats">
          <div class="stat"><span class="stat-v">${deg(day.high_f)}</span><span class="stat-l">High</span></div>
          <div class="stat"><span class="stat-v">${deg(day.avg_f)}</span><span class="stat-l">Average</span></div>
          <div class="stat"><span class="stat-v">${deg(day.low_f)}</span><span class="stat-l">Low</span></div>
        </div>
      </section>`;
  }
  const latest = (site.latest || []).find(r => r.depth_in === 2 && isNum(r.temp_f));
  if (!latest) return '';
  return `
    <section class="soil-summary" aria-label="Latest soil temperature at 2 inches">
      <div>
        <p class="summary-label">Current</p>
        <p class="summary-value">${deg(latest.temp_f)}</p>
      </div>
    </section>`;
}

const WATER_DEPTHS = [2, 10, 30];
const TEMP_DEPTHS = [2, 10, 30];
const TEMP_COLORS = { 2: '#F08C5A', 10: '#D9480F', 30: '#8A2A06' };
const colorForTemp = d => TEMP_COLORS[d] || '#D9480F';
const fmtMonth = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short' });
const fmtTipDay = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });

function parseYmd(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}
function ymdFromUtc(ms) { return new Date(ms).toISOString().slice(0, 10); }
function addDays(ymd, n) { return ymdFromUtc(parseYmd(ymd) + n * 86400000); }
function nextMonth(ymd) {
  const [y, m] = ymd.split('-').map(Number);
  return ymdFromUtc(Date.UTC(y, m, 1));
}

function depthSeries(season, depths, avgKey, highKey, lowKey, colors) {
  const all = season.depths_in || [];
  return depths.map((depth, s) => {
    const i = all.indexOf(depth);
    return {
      depth,
      color: colors[s % colors.length],
      points: (season.days || []).map(day => ({
        date: day.date,
        avg: i >= 0 ? (day[avgKey] || [])[i] : null,
        high: i >= 0 ? (day[highKey] || [])[i] : null,
        low: i >= 0 ? (day[lowKey] || [])[i] : null,
      })),
    };
  }).filter(s => s.points.some(p => isNum(p.avg) || isNum(p.high) || isNum(p.low)));
}

function niceStep(v, step) { return Math.ceil(v / step) * step; }
function niceFloor(v, step) { return Math.floor(v / step) * step; }

function seasonRange(days) {
  const firstData = days[0].date;
  const lastData = days[days.length - 1].date;
  const startYear = +firstData.slice(0, 4);
  const endYear = +lastData.slice(0, 4);
  const first = startYear + '-01-01';
  const end = (endYear + 1) + '-01-01';
  return { first, end, t0: parseYmd(first), t1: parseYmd(end) };
}

function oneSeasonPlot(seriesList, range, opts) {
  const { kind, unit, digits, title, yBot, yTop, height } = opts;
  const dates = (seriesList[0] && seriesList[0].points) || [];
  if (!dates.length) return '';
  const W = 1100, H = height, L = 0, R = 0, T = 10, B = 34;
  const { first, t0, t1 } = range;
  const x = t => L + (W - L - R) * (t - t0) / Math.max(1, t1 - t0);
  const yFn = v => T + (H - T - B) * (1 - (v - yBot) / (yTop - yBot));
  const plotW = W - L - R, plotH = H - T - B;

  let lastData = first;
  seriesList.forEach(s => s.points.forEach(pt => { if (isNum(pt.avg) || isNum(pt.high) || isNum(pt.low)) lastData = pt.date; }));
  const futureX = Math.min(W - R, Math.max(L, x(parseYmd(lastData))));
  let art = '';
  if (futureX < W - R) {
    art += `<rect class="season-future" x="${futureX.toFixed(1)}" y="${T}" width="${(W - R - futureX).toFixed(1)}" height="${plotH}" fill="#F6F7F5"/>`;
  }

  const ticks = [];
  for (let v = yBot; v <= yTop + 1e-9; v += 10) ticks.push(v);
  ticks.forEach(v => {
    const yy = yFn(v).toFixed(1);
    art += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#EEE" stroke-width="1"/>`;
  });
  const yLabel = v => kind === 'water' ? `${Math.round(v)}%` : `${Math.round(v)}&deg;`;
  const yTicks = ticks.map(v => `<li style="top:${((yTop - v) / (yTop - yBot) * 100).toFixed(3)}%">${yLabel(v)}</li>`).join('');

  const labelMonth = ymd => {
    const dt = new Date(parseYmd(ymd));
    const mon = fmtMonth.format(dt);
    const year = dt.getUTCFullYear();
    return (ymd === first || dt.getUTCMonth() === 0) ? `${mon} ${year}` : mon;
  };
  const xTicks = [];
  const narrow = window.matchMedia('(max-width:760px)').matches;
  const addMonth = ymd => {
    if (parseYmd(ymd) < t0 || parseYmd(ymd) > t1) return;
    if (ymd !== first && parseYmd(ymd) - t0 < 12 * 86400000) return;
    const mon = new Date(parseYmd(ymd)).getUTCMonth();
    if (narrow && ymd !== first && mon !== 0 && mon % 3 !== 0) return;
    const xx = x(parseYmd(ymd));
    let xf = 'translate(-50%,0)';
    if (xx < L + 28) xf = 'translate(0,0)';
    else if (xx > W - R - 28) xf = 'translate(-100%,0)';
    const left = ((xx - L) / Math.max(1, plotW) * 100).toFixed(3);
    xTicks.push(`<li style="left:${left}%;transform:${xf}">${esc(labelMonth(ymd))}</li>`);
  };
  addMonth(first);
  for (let month = nextMonth(first); parseYmd(month) <= t1; month = nextMonth(month)) addMonth(month);

  let plots = '';
  if (kind === 'temp') {
    const shallow = seriesList.find(s => s.depth === 2);
    if (shallow) {
      let top = '', bottom = [];
      shallow.points.forEach(pt => {
        if (!isNum(pt.high) || !isNum(pt.low)) return;
        const xx = x(parseYmd(pt.date)).toFixed(1);
        top += `${top ? 'L' : 'M'}${xx},${yFn(pt.high).toFixed(1)}`;
        bottom.push(`${xx},${yFn(pt.low).toFixed(1)}`);
      });
      if (top && bottom.length) {
        plots += `<path d="${top}L${bottom.reverse().join('L')}Z" fill="${shallow.color}" fill-opacity="0.15" stroke="none"/>`;
      }
    }
  }
  seriesList.forEach(s => {
    let path = '', pen = false;
    s.points.forEach(pt => {
      if (!isNum(pt.avg)) { pen = false; return; }
      path += `${pen ? 'L' : 'M'}${x(parseYmd(pt.date)).toFixed(1)},${yFn(pt.avg).toFixed(1)}`;
      pen = true;
    });
    const sw = kind === 'temp' ? 2 : 1.75;
    if (path) plots += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = [...s.points].reverse().find(pt => isNum(pt.avg));
    if (last) plots += `<circle cx="${x(parseYmd(last.date)).toFixed(1)}" cy="${yFn(last.avg).toFixed(1)}" r="3.5" fill="${s.color}"/>`;
  });

  const daySpan = Math.max(1, (t1 - t0) / 86400000);
  const hitW = Math.max(6, Math.min(18, plotW / daySpan));
  let hits = '';
  dates.forEach((pt, di) => {
    const xx = x(parseYmd(pt.date));
    const tip = { date: pt.date, unit, digits, items: seriesList.map(s => ({ depth: s.depth, avg: s.points[di].avg, high: s.points[di].high, low: s.points[di].low })) };
    hits += `<rect class="hit" data-day="${encodeURIComponent(JSON.stringify(tip))}" data-x="${xx.toFixed(1)}" x="${(xx - hitW / 2).toFixed(1)}" y="${T}" width="${hitW.toFixed(1)}" height="${plotH}" fill="transparent"/>`;
  });
  const hair = `<line class="crosshair" x1="0" x2="0" y1="${T}" y2="${T + plotH}" stroke="#536154" stroke-width="1" stroke-opacity="0.55" display="none"/>`;
  const legend = seriesList.map(s => `<li><i style="background:${s.color}"></i>${esc(s.depth)}&Prime;</li>`).join('');
  return `
    <div class="season-plot" data-kind="${kind}">
      <p class="chart-label">${title}</p>
      <ul class="legend" aria-label="Depths">${legend}</ul>
      <div class="season-frame">
        <ul class="season-y" style="top:${(T / H * 100).toFixed(3)}%;height:${((H - T - B) / H * 100).toFixed(3)}%">${yTicks}</ul>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title}">${art}${plots}${hits}${hair}</svg>
        <ul class="season-x">${xTicks.join('')}</ul>
      </div>
      <div class="season-tip"></div>
    </div>`;
}

function seasonChart(season) {
  const days = season.days || [];
  if (!days.length) return '';
  const water = depthSeries(season, WATER_DEPTHS, 'w_avg', 'w_high', 'w_low', WATER_DEPTHS.map(colorForDepth));
  const temp = depthSeries(season, TEMP_DEPTHS, 't_avg', 't_high', 't_low', TEMP_DEPTHS.map(colorForTemp));
  const range = seasonRange(days);
  let waterTop = 50;
  water.forEach(s => s.points.forEach(pt => {
    [pt.avg, pt.high].forEach(v => { if (isNum(v) && v > waterTop) waterTop = niceStep(v, 10); });
  }));
  return `<div class="season-charts">
      ${water.length ? oneSeasonPlot(water, range, { kind: 'water', unit: '%', digits: 1, title: 'Soil water, season', yBot: 0, yTop: waterTop, height: 300 }) : ''}
      ${temp.length ? oneSeasonPlot(temp, range, { kind: 'temp', unit: '&deg;', digits: 0, title: 'Soil temp, season', yBot: 30, yTop: 90, height: 260 }) : ''}
    </div>`;
}

function seasonBlock(site, i) {
  if (!site.season || !site.season.days || !site.season.days.length) return '';
  return `
    <div class="season" data-site="${i}">
      ${seasonChart(site.season)}
    </div>`;
}

function tipText(d) {
  const f = (v, unit, digits) => isNum(v) ? v.toFixed(digits) + unit : '&ndash;';
  const day = fmtTipDay.format(new Date(parseYmd(d.date)));
  const unit = d.unit || '', digits = d.digits ?? 1;
  const lines = (d.items || []).map(it => `${esc(it.depth)}&Prime; ${f(it.avg, unit, digits)} (${f(it.low, unit, digits)}&ndash;${f(it.high, unit, digits)})`);
  return `<strong>${esc(day)}</strong>${lines.length ? '<br>' + lines.join('<br>') : ''}`;
}

function placeTip(plot, event, hit, atX) {
  const tip = plot.querySelector('.season-tip');
  if (!tip) return;
  if (!hit) { tip.style.display = 'none'; return; }
  const d = JSON.parse(decodeURIComponent(hit.getAttribute('data-day')));
  tip.innerHTML = tipText(d);
  tip.style.display = 'block';
  const rect = plot.getBoundingClientRect();
  const svg = plot.querySelector('svg');
  const svgRect = svg.getBoundingClientRect();
  const left = (atX != null ? atX : event.clientX) - rect.left + 12;
  const top = (event && event.target && plot.contains(event.target) ? event.clientY - rect.top - 8 : svgRect.top - rect.top + 24);
  tip.style.left = Math.min(Math.max(0, left), Math.max(0, rect.width - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.max(0, top - tip.offsetHeight) + 'px';
}

function hideSeasonHover() {
  contentEl.querySelectorAll('.season-tip').forEach(t => { t.style.display = 'none'; });
  contentEl.querySelectorAll('.crosshair').forEach(h => h.setAttribute('display', 'none'));
}

function nearestHit(plot, clientX) {
  const svg = plot.querySelector('svg');
  if (!svg) return null;
  const hits = [...svg.querySelectorAll('rect.hit')];
  if (!hits.length) return null;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const x = (clientX - rect.left) / Math.max(1, rect.width) * vb.width;
  let best = null, bestD = Infinity;
  hits.forEach(h => {
    const cx = parseFloat(h.getAttribute('data-x'));
    const d = Math.abs(cx - x);
    if (d < bestD) { bestD = d; best = h; }
  });
  return best;
}

function syncSeasonHover(season, plot, event) {
  const hit = nearestHit(plot, event.clientX);
  if (!hit) { hideSeasonHover(); return; }
  const date = JSON.parse(decodeURIComponent(hit.getAttribute('data-day'))).date;
  season.querySelectorAll('.season-plot').forEach(p => {
    const local = [...p.querySelectorAll('rect.hit')].find(h => {
      try { return JSON.parse(decodeURIComponent(h.getAttribute('data-day'))).date === date; } catch (err) { return false; }
    });
    const hair = p.querySelector('.crosshair');
    const xx = local ? local.getAttribute('data-x') : hit.getAttribute('data-x');
    if (hair && xx != null) {
      hair.setAttribute('x1', xx);
      hair.setAttribute('x2', xx);
      hair.setAttribute('display', 'inline');
    }
    const svg = p.querySelector('svg');
    const svgRect = svg.getBoundingClientRect();
    const atX = svgRect.left + (parseFloat(xx) / svg.viewBox.baseVal.width) * svgRect.width;
    placeTip(p, event, local || hit, atX);
  });
}

let sitesCache = [];
const contentEl = document.getElementById('content');
contentEl.addEventListener('click', e => {
  const season = e.target.closest('.season');
  const plot = e.target.closest('.season-plot');
  if (season && plot) syncSeasonHover(season, plot, e);
});
contentEl.addEventListener('mousemove', e => {
  const season = e.target.closest('.season');
  const plot = e.target.closest('.season-plot');
  if (!season || !plot) { hideSeasonHover(); return; }
  syncSeasonHover(season, plot, e);
});
contentEl.addEventListener('mouseleave', hideSeasonHover);

function siteCard(site, i) {
  const rows = (site.latest || []).map(r => `
        <tr><td>${esc(r.depth_in)}&Prime;</td><td class="n">${isNum(r.temp_f) ? Math.round(r.temp_f) + '&deg;' : '&ndash;'}</td><td class="n">${pct(r.water_pct)}</td></tr>`).join('');
  return `
    <section class="site card" aria-label="${esc(site.name)}">
      <div class="site-head">
        <h2>${esc(site.name)}</h2>
        <p class="site-meta">${site.location && String(site.location).trim().toLowerCase() !== String(site.name||'').trim().toLowerCase() ? esc(site.location) + ' &middot; ' : ''}Last reading <span class="when">${esc(ct(site.last_read_at))}</span></p>
      </div>
      <div class="site-body">
        <table class="depths">
          <colgroup><col class="c-d"><col class="c-t"><col class="c-w"><col></colgroup>
          <thead><tr><th scope="col">Depth</th><th scope="col" class="n">Temp</th><th scope="col" class="n">Water</th></tr></thead>
          <tbody>${rows}
          </tbody>
        </table>
        ${seasonBlock(site, i)}
      </div>
    </section>`;
}

async function loadData() {
  const content = contentEl;
  try {
    const resp = await fetch('/api/soil');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const sites = (data.sites || []).filter(s => s.last_read_at);
    if (!sites.length) throw new Error('No sites');
    sitesCache = sites;
    content.innerHTML = summary(sites[0]) + sites.map(siteCard).join('');
  } catch (e) {
    sitesCache = [];
    content.innerHTML = '<div class="no-data">Coming soon</div>';
  }
}

loadData();
</script>
</body>
</html>
