<script>
const TZ = 'America/Chicago';
const DEPTH_COLORS = { 2: '#4FA3E0', 6: '#3590C9', 10: '#1F6FB2', 14: '#1A62A0', 18: '#165890', 22: '#124E80', 26: '#0E4574', 30: '#0B3C6E', 33: '#082A4E' };
const colorForDepth = d => DEPTH_COLORS[d] || '#1F6FB2';
const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtDayKey = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const deg = v => isNum(v) ? Math.round(v) + '&deg;' : '&ndash;';
const pct = v => isNum(v) ? v.toFixed(1) + '%' : '&ndash;';
const ct = iso => fmtTime.format(new Date(iso)) + ' CT';

function dayAtDepth(season, depth, todayOnly) {
  const i = ((season && season.depths_in) || []).indexOf(depth);
  if (i < 0) return null;
  const today = fmtDayKey.format(new Date());
  const days = season.days || [];
  const pool = todayOnly ? days.filter(d => d.date === today) : days;
  for (let n = pool.length - 1; n >= 0; n--) {
    const d = pool[n];
    const avg = (d.t_avg || [])[i], high = (d.t_high || [])[i], low = (d.t_low || [])[i];
    if (isNum(avg) || isNum(high) || isNum(low)) return { date: d.date, avg_f: avg, high_f: high, low_f: low };
  }
  return null;
}

const TREND_WINDOW_MS = 3 * 3600 * 1000;
function tempAtDepthNear(site, depth, atMs) {
  const series = site.temp_series || {};
  const depths = series.depths_in || [];
  const i = depths.indexOf(depth);
  const points = series.points || [];
  if (i >= 0 && points.length) {
    let best = null, bestD = Infinity;
    points.forEach(p => {
      if (!p.t) return;
      const v = Array.isArray(p.t_f) ? p.t_f[i] : (Array.isArray(p.temp) ? p.temp[i] : null);
      if (!isNum(v)) return;
      const d = Math.abs(new Date(p.t).getTime() - atMs);
      if (d < bestD) { bestD = d; best = { temp_f: v, t: p.t }; }
    });
    if (best && bestD <= TREND_WINDOW_MS) return best;
  }
  const wdepths = ((site.water_series || {}).depths_in) || [];
  const wi = wdepths.indexOf(depth);
  const wpoints = ((site.water_series || {}).points) || [];
  if (wi >= 0 && wpoints.length) {
    let best = null, bestD = Infinity;
    wpoints.forEach(p => {
      if (!p.t) return;
      const v = Array.isArray(p.t_f) ? p.t_f[wi] : (Array.isArray(p.temp) ? p.temp[wi] : (isNum(p.temp_f) ? p.temp_f : null));
      if (!isNum(v)) return;
      const d = Math.abs(new Date(p.t).getTime() - atMs);
      if (d < bestD) { bestD = d; best = { temp_f: v, t: p.t }; }
    });
    if (best && bestD <= TREND_WINDOW_MS) return best;
  }
  return null;
}

function trendArrow(site, current) {
  if (!isNum(current) || !site.last_read_at) return '';
  const then = tempAtDepthNear(site, 2, new Date(site.last_read_at).getTime() - 24 * 3600 * 1000);
  if (!then || !isNum(then.temp_f)) return '';
  const delta = current - then.temp_f;
  if (Math.abs(delta) < 0.25) return '';
  const up = delta > 0;
  const label = up ? 'Warmer than 24 hours ago' : 'Cooler than 24 hours ago';
  const path = up ? 'M4 16 L12 6 L20 16' : 'M4 8 L12 18 L20 8';
  return `<span class="trend trend-${up ? 'up' : 'down'}" aria-label="${esc(label)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span>`;
}

function summary(site) {
  const latest = (site.latest || []).find(r => r.depth_in === 2 && isNum(r.temp_f));
  const today = dayAtDepth(site.season, 2, true);
  const current = latest ? latest.temp_f : (today && isNum(today.avg_f) ? today.avg_f : null);
  if (!isNum(current) && !(today && (isNum(today.high_f) || isNum(today.low_f) || isNum(today.avg_f)))) return '';
  const value = isNum(current) ? deg(current) : '&ndash;';
  const arrow = isNum(current) ? trendArrow(site, current) : '';
  const stats = (today && (isNum(today.high_f) || isNum(today.avg_f) || isNum(today.low_f))) ? `
        <div class="summary-today">
          <p class="today-label">Today</p>
          <div class="summary-stats">
            <div class="stat"><span class="stat-v">${deg(today.high_f)}</span><span class="stat-l">High</span></div>
            <div class="stat"><span class="stat-v">${deg(today.avg_f)}</span><span class="stat-l">Average</span></div>
            <div class="stat"><span class="stat-v">${deg(today.low_f)}</span><span class="stat-l">Low</span></div>
          </div>
        </div>` : '';
  return `
      <section class="soil-summary" aria-label="Current soil temperature at 2 inches">
        <div>
          <p class="summary-label">Current</p>
          <p class="summary-value">${value}${arrow}</p>
          <p class="summary-unit">2&Prime; soil temp &deg;F</p>
        </div>
        ${stats}
      </section>`;
}

const WATER_DEPTHS = [2, 10, 30];
const TEMP_DEPTHS = [2, 10, 30];
const TEMP_COLORS = { 2: '#F08C5A', 10: '#D9480F', 30: '#8A2A06' };
const colorForTemp = d => TEMP_COLORS[d] || '#D9480F';
const fmtMonth = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short' });
const fmtTickDay = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const fmtTipDay = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });

function parseYmd(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}
function ymdFromUtc(ms) { return new Date(ms).toISOString().slice(0, 10); }
function addDays(ymd, n) { return ymdFromUtc(parseYmd(ymd) + n * 86400000); }
function nextMonth(ymd) {
  const [y, m] = ymd.split('-').map(Number);
  return ymdFromUtc(Date.UTC(y, m, 1));
}

function depthSeries(season, depths, avgKey, highKey, lowKey, colors) {
  const all = season.depths_in || [];
  return depths.map((depth, s) => {
    const i = all.indexOf(depth);
    return {
      depth,
      color: colors[s % colors.length],
      points: (season.days || []).map(day => ({
        date: day.date,
        avg: i >= 0 ? (day[avgKey] || [])[i] : null,
        high: i >= 0 ? (day[highKey] || [])[i] : null,
        low: i >= 0 ? (day[lowKey] || [])[i] : null,
      })),
    };
  }).filter(s => s.points.some(p => isNum(p.avg) || isNum(p.high) || isNum(p.low)));
}

function niceStep(v, step) { return Math.ceil(v / step) * step; }
function niceFloor(v, step) { return Math.floor(v / step) * step; }

const YEAR_AXIS_DAYS = 30;
const DAILY_AXIS_DAYS = 14;
const AXIS_PAD_DAYS = 1;
const fmtHour = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
const fmtDayHour = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

function pointAt(pt) { return isNum(pt.at) ? pt.at : parseYmd(pt.date); }

function pointTemp(p, i) {
  if (Array.isArray(p.t_f) && isNum(p.t_f[i])) return p.t_f[i];
  if (Array.isArray(p.temp) && isNum(p.temp[i])) return p.temp[i];
  return null;
}

function readingPoints(site) {
  return (((site.water_series || {}).points) || []).filter(p => p.t && Number.isFinite(Date.parse(p.t)));
}

function historySpanDays(site) {
  const pts = readingPoints(site);
  const days = ((site.season || {}).days) || [];
  const times = pts.map(p => Date.parse(p.t));
  if (days.length) {
    times.push(parseYmd(days[0].date));
    times.push(parseYmd(days[days.length - 1].date));
  }
  if (site.last_read_at) times.push(Date.parse(site.last_read_at));
  const valid = times.filter(Number.isFinite);
  if (valid.length < 2) return days.length || (valid.length ? 0 : Infinity);
  return (Math.max(...valid) - Math.min(...valid)) / 86400000;
}

function useReadings(site) {
  return readingPoints(site).length >= 2 && historySpanDays(site) < DAILY_AXIS_DAYS;
}

function readingSeries(site, depths, colors, pick) {
  const all = ((site.water_series || {}).depths_in) || [];
  const pts = readingPoints(site);
  return depths.map((depth, s) => {
    const i = all.indexOf(depth);
    return {
      depth,
      color: colors[s % colors.length],
      points: pts.map(p => ({
        t: p.t,
        at: Date.parse(p.t),
        date: fmtDayKey.format(new Date(p.t)),
        avg: i >= 0 ? pick(p, i) : null,
        high: null,
        low: null,
      })),
    };
  }).filter(s => s.points.some(p => isNum(p.avg)));
}

function readingsRange(seriesList, lastReadAt) {
  const ats = [];
  seriesList.forEach(s => s.points.forEach(pt => { if (isNum(pt.avg) && isNum(pt.at)) ats.push(pt.at); }));
  if (!ats.length) return null;
  let t0 = Math.min(...ats), t1 = Math.max(...ats);
  if (lastReadAt) {
    const last = Date.parse(lastReadAt);
    if (Number.isFinite(last) && last > t1) t1 = last;
  }
  const pad = Math.max(10 * 60000, (t1 - t0) * 0.05);
  return { t0: t0 - pad, t1: t1 + pad, dataStart: t0, dataEnd: t1, zoomed: true, mode: 'readings' };
}

function seasonRange(days) {
  const firstData = days[0].date;
  const lastData = days[days.length - 1].date;
  const today = fmtDayKey.format(new Date());
  const last = lastData > today ? lastData : today;
  const spanDays = (parseYmd(lastData) - parseYmd(firstData)) / 86400000;
  if (days.length >= YEAR_AXIS_DAYS || spanDays >= YEAR_AXIS_DAYS - 1) {
    const startYear = +firstData.slice(0, 4);
    const endYear = +last.slice(0, 4);
    const first = startYear + '-01-01';
    const end = (endYear + 1) + '-01-01';
    return { first, end, t0: parseYmd(first), t1: parseYmd(end), lastTick: end, zoomed: false, mode: 'year' };
  }
  const t0 = parseYmd(firstData) - AXIS_PAD_DAYS * 86400000;
  const t1 = parseYmd(last) + (AXIS_PAD_DAYS + 1) * 86400000;
  return { first: ymdFromUtc(t0), end: ymdFromUtc(t1), t0, t1, lastTick: last, zoomed: true, mode: 'daily' };
}

function xAxisDates(range, narrow) {
  const { first, t0, t1, zoomed } = range;
  if (!zoomed) {
    const dates = [first];
    for (let month = nextMonth(first); parseYmd(month) <= t1; month = nextMonth(month)) dates.push(month);
    if (narrow) return dates.filter((ymd, i) => i === 0 || i === dates.length - 1 || new Date(parseYmd(ymd)).getUTCMonth() % 3 === 0);
    return dates;
  }
  const lastTick = range.lastTick || ymdFromUtc(t1 - 86400000);
  const endMs = parseYmd(lastTick);
  const spanDays = Math.max(1, Math.round((endMs - t0) / 86400000));
  const target = narrow ? 3 : 5;
  const step = Math.max(1, Math.round(spanDays / (target - 1)));
  const dates = [];
  for (let i = 0; i <= spanDays; i += step) dates.push(ymdFromUtc(t0 + i * 86400000));
  if (dates[dates.length - 1] !== lastTick) dates.push(lastTick);
  return dates.filter(ymd => parseYmd(ymd) <= endMs);
}

function xAxisTimes(range, narrow, seriesList) {
  const ats = [];
  seriesList.forEach(s => s.points.forEach(pt => { if (isNum(pt.avg) && isNum(pt.at)) ats.push(pt.at); }));
  if (isNum(range.dataStart)) ats.push(range.dataStart);
  if (isNum(range.dataEnd)) ats.push(range.dataEnd);
  ats.sort((a, b) => a - b);
  if (!ats.length) return [];
  const start = ats[0], end = ats[ats.length - 1];
  const sameDay = fmtDayKey.format(new Date(start)) === fmtDayKey.format(new Date(end));
  const target = narrow ? 3 : 4;
  const ticks = [];
  if (end === start) ticks.push(start);
  else {
    for (let i = 0; i < target; i++) ticks.push(Math.round(start + (end - start) * i / (target - 1)));
  }
  const uniq = [];
  ticks.forEach(t => { if (!uniq.some(u => Math.abs(u - t) < 60 * 1000)) uniq.push(t); });
  return uniq.map(t => ({ at: t, label: sameDay ? fmtHour.format(new Date(t)) : fmtDayHour.format(new Date(t)) }));
}

function placeXTicks(items, x, L, W, R, plotW) {
  const mapped = items.map(it => {
    const at = isNum(it.at) ? it.at : parseYmd(it.ymd || it);
    const xx = x(at);
    return { xx, label: it.label, pct: (xx - L) / Math.max(1, plotW) * 100 };
  }).filter(it => it.xx >= L - 1 && it.xx <= W - R + 1);
  if (!mapped.length) return [];
  const minPct = 10;
  const chosen = [];
  const tryAdd = it => {
    if (chosen.some(c => Math.abs(c.pct - it.pct) < minPct)) return;
    chosen.push(it);
  };
  tryAdd(mapped[0]);
  if (mapped.length > 1) tryAdd(mapped[mapped.length - 1]);
  mapped.slice(1, -1).forEach(tryAdd);
  chosen.sort((a, b) => a.xx - b.xx);
  return chosen.map(it => {
    let xf = 'translate(-50%,0)';
    if (it.xx < L + 28) xf = 'translate(0,0)';
    else if (it.xx > W - R - 28) xf = 'translate(-100%,0)';
    return `<li style="left:${it.pct.toFixed(3)}%;transform:${xf}">${esc(it.label)}</li>`;
  });
}

function oneSeasonPlot(seriesList, range, opts) {
  const { kind, unit, digits, title, yBot, yTop, height } = opts;
  const dates = (seriesList[0] && seriesList[0].points) || [];
  if (!dates.length) return '';
  const W = 1100, H = height, L = 0, R = 0, T = 10, B = 34;
  const { t0, t1, zoomed, mode } = range;
  const x = t => L + (W - L - R) * (t - t0) / Math.max(1, t1 - t0);
  const yFn = v => T + (H - T - B) * (1 - (v - yBot) / (yTop - yBot));
  const plotW = W - L - R, plotH = H - T - B;
  const narrow = window.matchMedia('(max-width:960px)').matches;

  let lastAt = t0;
  seriesList.forEach(s => s.points.forEach(pt => { if (isNum(pt.avg) || isNum(pt.high) || isNum(pt.low)) lastAt = pointAt(pt); }));
  let art = '';
  if (!zoomed) {
    const futureX = Math.min(W - R, Math.max(L, x(lastAt)));
    if (futureX < W - R) {
      art += `<rect class="season-future" x="${futureX.toFixed(1)}" y="${T}" width="${(W - R - futureX).toFixed(1)}" height="${plotH}" fill="#F6F7F5"/>`;
    }
  }

  const ticks = [];
  for (let v = yBot; v <= yTop + 1e-9; v += 10) ticks.push(v);
  ticks.forEach(v => {
    const yy = yFn(v).toFixed(1);
    art += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#EEE" stroke-width="1"/>`;
  });
  const yLabel = v => kind === 'water' ? `${Math.round(v)}%` : `${Math.round(v)}&deg;`;
  const yTicks = ticks.map(v => `<li style="top:${((yTop - v) / (yTop - yBot) * 100).toFixed(3)}%">${yLabel(v)}</li>`).join('');

  let refLabel = '';
  if (kind === 'temp' && yBot < 50 && 50 < yTop) {
    const yy = yFn(50);
    art += `<line x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#666" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4"/>`;
    const topPct = (T / H * 100) + ((yTop - 50) / (yTop - yBot) * ((H - T - B) / H * 100));
    refLabel = `<span class="season-ref" style="top:${topPct.toFixed(3)}%">50&deg;</span>`;
  }

  const labelMonth = ymd => {
    const dt = new Date(parseYmd(ymd));
    const mon = fmtMonth.format(dt);
    const year = dt.getUTCFullYear();
    return (ymd === range.first || dt.getUTCMonth() === 0) ? `${mon} ${year}` : mon;
  };
  const labelDay = ymd => fmtTickDay.format(new Date(parseYmd(ymd)));
  const xItems = mode === 'readings'
    ? xAxisTimes(range, narrow, seriesList)
    : xAxisDates(range, narrow).map(ymd => ({ ymd, label: zoomed ? labelDay(ymd) : labelMonth(ymd) }));
  const xTicks = placeXTicks(xItems, x, L, W, R, plotW);

  let plots = '';
  if (kind === 'temp' && mode !== 'readings') {
    const shallow = seriesList.find(s => s.depth === 2);
    if (shallow) {
      let top = '', bottom = [];
      shallow.points.forEach(pt => {
        if (!isNum(pt.high) || !isNum(pt.low)) return;
        const xx = x(pointAt(pt)).toFixed(1);
        top += `${top ? 'L' : 'M'}${xx},${yFn(pt.high).toFixed(1)}`;
        bottom.push(`${xx},${yFn(pt.low).toFixed(1)}`);
      });
      if (top && bottom.length) {
        plots += `<path d="${top}L${bottom.reverse().join('L')}Z" fill="${shallow.color}" fill-opacity="0.15" stroke="none"/>`;
      }
    }
  }
  const nPts = Math.max(...seriesList.map(s => s.points.filter(pt => isNum(pt.avg)).length), 0);
  const r = nPts > 60 ? 2 : 3;
  seriesList.forEach(s => {
    let path = '', pen = false;
    s.points.forEach(pt => {
      if (!isNum(pt.avg)) { pen = false; return; }
      path += `${pen ? 'L' : 'M'}${x(pointAt(pt)).toFixed(1)},${yFn(pt.avg).toFixed(1)}`;
      pen = true;
    });
    const sw = kind === 'temp' ? 2 : 1.75;
    if (path) plots += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.points.forEach(pt => {
      if (!isNum(pt.avg)) return;
      plots += `<circle cx="${x(pointAt(pt)).toFixed(1)}" cy="${yFn(pt.avg).toFixed(1)}" r="${r}" fill="${s.color}"/>`;
    });
  });

  const nHits = Math.max(dates.length, 1);
  const hitW = Math.max(narrow ? 32 : 8, Math.min(44, plotW / nHits));
  let hits = '';
  dates.forEach((pt, di) => {
    const xx = x(pointAt(pt));
    const tip = { date: pt.date, t: pt.t || null, unit, digits, items: seriesList.map(s => ({ depth: s.depth, avg: s.points[di] && s.points[di].avg, high: s.points[di] && s.points[di].high, low: s.points[di] && s.points[di].low })) };
    hits += `<rect class="hit" data-day="${encodeURIComponent(JSON.stringify(tip))}" data-x="${xx.toFixed(1)}" x="${(xx - hitW / 2).toFixed(1)}" y="${T}" width="${hitW.toFixed(1)}" height="${plotH}" fill="transparent"/>`;
  });
  const hair = `<line class="crosshair" x1="0" x2="0" y1="${T}" y2="${T + plotH}" stroke="#536154" stroke-width="1" stroke-opacity="0.55" display="none"/>`;
  const legend = seriesList.map(s => `<li><i style="background:${s.color}"></i>${esc(s.depth)}&Prime;</li>`).join('');
  return `
    <div class="season-plot" data-kind="${kind}">
      <p class="chart-label">${title}</p>
      <ul class="legend" aria-label="Depths">${legend}</ul>
      <div class="season-frame">
        <ul class="season-y" style="top:${(T / H * 100).toFixed(3)}%;height:${((H - T - B) / H * 100).toFixed(3)}%">${yTicks}</ul>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title}">${art}${plots}${hits}${hair}</svg>
        <ul class="season-x">${xTicks.join('')}</ul>
        ${refLabel}
      </div>
      <div class="season-tip"></div>
    </div>`;
}

function waterTopOf(seriesList) {
  let waterTop = 50;
  seriesList.forEach(s => s.points.forEach(pt => {
    [pt.avg, pt.high].forEach(v => { if (isNum(v) && v > waterTop) waterTop = niceStep(v, 10); });
  }));
  return waterTop;
}

function latestTempSeries(site) {
  if (!site.last_read_at) return [];
  const at = Date.parse(site.last_read_at);
  if (!Number.isFinite(at)) return [];
  return TEMP_DEPTHS.map(depth => {
    const row = (site.latest || []).find(r => r.depth_in === depth && isNum(r.temp_f));
    if (!row) return null;
    return {
      depth,
      color: colorForTemp(depth),
      points: [{ t: site.last_read_at, at, date: fmtDayKey.format(new Date(at)), avg: row.temp_f, high: null, low: null }],
    };
  }).filter(Boolean);
}

function seasonChart(site) {
  const season = site.season || {};
  const days = season.days || [];
  let water = [], temp = [], range = null;
  if (useReadings(site)) {
    water = readingSeries(site, WATER_DEPTHS, WATER_DEPTHS.map(colorForDepth), (p, i) => (p.w || [])[i]);
    temp = readingSeries(site, TEMP_DEPTHS, TEMP_DEPTHS.map(colorForTemp), pointTemp);
    if (!temp.length) temp = latestTempSeries(site);
    range = readingsRange(water.concat(temp), site.last_read_at);
  }
  if (!range) {
    water = depthSeries(season, WATER_DEPTHS, 'w_avg', 'w_high', 'w_low', WATER_DEPTHS.map(colorForDepth));
    temp = depthSeries(season, TEMP_DEPTHS, 't_avg', 't_high', 't_low', TEMP_DEPTHS.map(colorForTemp));
    if (!days.length) return '';
    range = seasonRange(days);
  }
  if (!range || (!water.length && !temp.length)) return '';
  return `<div class="season-charts">
      ${temp.length ? oneSeasonPlot(temp, range, { kind: 'temp', unit: '&deg;', digits: 0, title: 'Soil temp, season', yBot: 30, yTop: 90, height: 300 }) : ''}
      ${water.length ? oneSeasonPlot(water, range, { kind: 'water', unit: '%', digits: 1, title: 'Soil water, season', yBot: 0, yTop: waterTopOf(water), height: 300 }) : ''}
    </div>`;
}

function seasonBlock(site, i) {
  const charts = seasonChart(site);
  if (!charts) return '';
  return `
    <div class="season" data-site="${i}">
      ${charts}
    </div>`;
}

function tipText(d) {
  const f = (v, unit, digits) => isNum(v) ? v.toFixed(digits) + unit : '&ndash;';
  const head = d.t ? fmtTime.format(new Date(d.t)) + ' CT' : fmtTipDay.format(new Date(parseYmd(d.date)));
  const unit = d.unit || '', digits = d.digits ?? 1;
  const lines = (d.items || []).map(it => {
    const range = (isNum(it.low) || isNum(it.high)) ? ` (${f(it.low, unit, digits)}&ndash;${f(it.high, unit, digits)})` : '';
    return `${esc(it.depth)}&Prime; ${f(it.avg, unit, digits)}${range}`;
  });
  return `<strong>${esc(head)}</strong>${lines.length ? '<br>' + lines.join('<br>') : ''}`;
}

function placeTip(plot, event, hit, atX) {
  const tip = plot.querySelector('.season-tip');
  if (!tip) return;
  if (!hit) { tip.style.display = 'none'; return; }
  const d = JSON.parse(decodeURIComponent(hit.getAttribute('data-day')));
  tip.innerHTML = tipText(d);
  tip.style.display = 'block';
  const rect = plot.getBoundingClientRect();
  const svg = plot.querySelector('svg');
  const svgRect = svg.getBoundingClientRect();
  const left = (atX != null ? atX : event.clientX) - rect.left + 12;
  const top = (event && event.target && plot.contains(event.target) ? event.clientY - rect.top - 8 : svgRect.top - rect.top + 24);
  tip.style.left = Math.min(Math.max(0, left), Math.max(0, rect.width - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.max(0, top - tip.offsetHeight) + 'px';
}

function hideSeasonHover() {
  contentEl.querySelectorAll('.season-tip').forEach(t => { t.style.display = 'none'; });
  contentEl.querySelectorAll('.crosshair').forEach(h => h.setAttribute('display', 'none'));
}

function nearestHit(plot, clientX) {
  const svg = plot.querySelector('svg');
  if (!svg) return null;
  const hits = [...svg.querySelectorAll('rect.hit')];
  if (!hits.length) return null;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const x = (clientX - rect.left) / Math.max(1, rect.width) * vb.width;
  let best = null, bestD = Infinity;
  hits.forEach(h => {
    const cx = parseFloat(h.getAttribute('data-x'));
    const d = Math.abs(cx - x);
    if (d < bestD) { bestD = d; best = h; }
  });
  return best;
}

function syncSeasonHover(season, plot, event) {
  const hit = nearestHit(plot, event.clientX);
  if (!hit) { hideSeasonHover(); return; }
  const date = JSON.parse(decodeURIComponent(hit.getAttribute('data-day'))).date;
  season.querySelectorAll('.season-plot').forEach(p => {
    const local = [...p.querySelectorAll('rect.hit')].find(h => {
      try { return JSON.parse(decodeURIComponent(h.getAttribute('data-day'))).date === date; } catch (err) { return false; }
    });
    const hair = p.querySelector('.crosshair');
    const xx = local ? local.getAttribute('data-x') : hit.getAttribute('data-x');
    if (hair && xx != null) {
      hair.setAttribute('x1', xx);
      hair.setAttribute('x2', xx);
      hair.setAttribute('display', 'inline');
    }
    const svg = p.querySelector('svg');
    const svgRect = svg.getBoundingClientRect();
    const atX = svgRect.left + (parseFloat(xx) / svg.viewBox.baseVal.width) * svgRect.width;
    placeTip(p, event, local || hit, atX);
  });
}

let sitesCache = [];
const contentEl = document.getElementById('content');
contentEl.addEventListener('click', e => {
  const season = e.target.closest('.season');
  const plot = e.target.closest('.season-plot');
  if (season && plot) syncSeasonHover(season, plot, e);
});
contentEl.addEventListener('mousemove', e => {
  const season = e.target.closest('.season');
  const plot = e.target.closest('.season-plot');
  if (!season || !plot) { hideSeasonHover(); return; }
  syncSeasonHover(season, plot, e);
});
contentEl.addEventListener('mouseleave', hideSeasonHover);

function siteCard(site, i) {
  const rows = (site.latest || []).map(r => `
        <tr><td>${esc(r.depth_in)}&Prime;</td><td class="n">${isNum(r.temp_f) ? Math.round(r.temp_f) + '&deg;' : '&ndash;'}</td><td class="n">${pct(r.water_pct)}</td></tr>`).join('');
  return `
    <section class="site card" aria-label="${esc(site.name)}">
      <div class="site-head">
        <h2>${esc(site.name)}</h2>
        <p class="site-meta">${site.location && String(site.location).trim().toLowerCase() !== String(site.name||'').trim().toLowerCase() ? esc(site.location) + ' &middot; ' : ''}Last reading <span class="when">${esc(ct(site.last_read_at))}</span></p>
      </div>
      ${summary(site)}
      <div class="site-body">
        <table class="depths">
          <colgroup><col class="c-d"><col class="c-t"><col class="c-w"><col></colgroup>
          <thead><tr><th scope="col">Depth</th><th scope="col" class="n">Temp</th><th scope="col" class="n">Water</th></tr></thead>
          <tbody>${rows}
          </tbody>
        </table>
        ${seasonBlock(site, i)}
      </div>
    </section>`;
}

async function loadData() {
  const content = contentEl;
  try {
    const resp = await fetch('/api/soil');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const sites = (data.sites || []).filter(s => s.last_read_at);
    if (!sites.length) throw new Error('No sites');
    sitesCache = sites;
    content.innerHTML = sites.map((site, i) => siteCard(site, i)).join('');
  } catch (e) {
    sitesCache = [];
    content.innerHTML = '<div class="no-data">Coming soon</div>';
  }
}

loadData();
</script>
